<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B192C"/>
      <stop offset="50%" stop-color="#1E3E62"/>
      <stop offset="100%" stop-color="#071220"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#F59E0B" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Outer Gold Shield Outline -->
  <path d="M 256 64 C 344 64 384 96 384 192 C 384 316 288 392 256 424 C 224 392 128 316 128 192 C 128 96 168 64 256 64 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="8" stroke-linejoin="round" opacity="0.4"/>

  <!-- Inner Gold Shield -->
  <path d="M 256 84 C 330 84 364 112 364 192 C 364 298 280 368 256 396 C 232 368 148 298 148 192 C 148 112 182 84 256 84 Z" 
        fill="#081423" stroke="url(#goldGrad)" stroke-width="4" stroke-linejoin="round"/>

  <!-- Graduation Cap / Mortarboard in Gold -->
  <polygon points="256,140 336,180 256,220 176,180" fill="url(#goldGrad)" filter="url(#goldGlow)"/>
  <polygon points="256,204 316,180 316,196 256,220" fill="#B45309"/>
  <!-- Cap Tassel -->
  <path d="M 324 186 C 332 200 336 216 336 232" fill="none" stroke="#FDE68A" stroke-width="4" stroke-linecap="round"/>
  <circle cx="336" cy="236" r="6" fill="#FDE68A"/>

  <!-- Open Book Motifs -->
  <path d="M 200,270 C 230,260 250,274 256,278 C 262,274 282,260 312,270 C 312,308 282,300 256,316 C 230,300 200,308 200,270 Z" 
        fill="url(#goldGrad)"/>
  <path d="M 256,278 L 256,316" stroke="#0B192C" stroke-width="3"/>

  <!-- Stylized Monogram Text "AUI" -->
  <text x="256" y="360" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="34" font-weight="800" 
        fill="#FFFFFF" text-anchor="middle" letter-spacing="4">AUI</text>
  <text x="256" y="380" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="600" 
        fill="url(#goldGrad)" text-anchor="middle" letter-spacing="2">CAMPUS MANAGER</text>
</svg>
